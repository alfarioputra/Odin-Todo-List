<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="84bb4fc080631c2605f1.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Odibee+Sans&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Quicksand:wght@300..700&family=Rethink+Sans:ital,wght@0,400..800;1,400..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<script defer src="main.js"></script></head>

<body>
    <div class="container">
        <div class="side-bar">
            <h1>To-do list</h1>
            <div class="project-container">
                <div class="project selected" id="all-task">
                    <img src="5056baa4b18a9ef1e812.svg" alt="all task"/>
                    <p>All Task</p>
                </div>
                <div class="project-title">
                    <img src="7981e4f55ca8e69b87b3.svg" alt="folder" />
                    <h2>Projects</h2>
                </div>
            </div>
            <div class="projects" id="my-projects"></div>
            <form class="projects-form visibility">
                <input class="input-form" type="text" placeholder="Add your project" >
                <div class="projects-form-btn">
                    <button class="cancel-btn" type="button">Cancel</button>
                    <button class="save-btn" type="submit">Save</button>
                </div>
            </form>
            <button class="new-btn" id="new-project">New Project</button>
        </div>
        <div class="todos-container">
            <div class="todo-list-container" id="todos"></div>
            <form class="todos-form visibility">
                <div class="cancel-form">
                    <h2>Add New Task</h2>
                    <button id="close" class="cancel-btn-form" type="button">×</button>
                </div>
                <label for="title">
                    Title *
                    <input id="title" class="todos-input" type="text" required/>
                </label>
                <label for="description">
                    Description
                    <input id="description" class="todos-input" type="text">
                </label>
                <div class="priority-date">
                    <label for="priority">
                        Priority
                        <select id="priority" class="priority-date-form">
                            <option value>--no priority--</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </label>
                    <label for="dueDate">
                        Due Date
                        <input id="date" class="priority-date-form" type="date">
                    </label>
                </div>
                <label>
                    Notes
                    <textarea id="notes" class="todos-input" id="notes" rows="5"></textarea>
                </label>
                <div class="todos-form-btn">
                    <button id="cancel" class="cancel-btn" type="button">Cancel</button>
                    <button id="save" class="save-btn" type="submit">Save</button>
                </div>
            </form>
            <button class="new-task" id="new-task">New Task</button>
        </div>
    </div>
</body>
</html>
